map $request_method $minpred_predict_key { POST $binary_remote_addr; default ""; }
map $request_method $minpred_status_key { GET $binary_remote_addr; default ""; }
limit_req_zone $minpred_predict_key zone=minpred_predict:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=minpred_api:10m rate=10r/m;
limit_req_zone $minpred_status_key zone=minpred_status:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=minpred_conn:10m;

server {
    listen 3375;
    server_name _;
    server_tokens off;
    client_max_body_size 64m;
    client_body_timeout 120s;
    keepalive_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;

    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    location = /minpred/api/predict {
        limit_conn minpred_conn 3;
        limit_req zone=minpred_predict burst=2 nodelay;
        limit_req zone=minpred_status burst=10 nodelay;
        proxy_pass http://app:3375;
    }

    location ~ ^/minpred-2\.0/api/(accession|fasta-check)$ {
        limit_req zone=minpred_api burst=5 nodelay;
        limit_conn minpred_conn 5;
        proxy_pass http://app:3375;
    }

    location ~ ^/minpred-2\.0/api/structure/(secondary|tertiary)$ {
        limit_req zone=minpred_api burst=2 nodelay;
        limit_conn minpred_conn 2;
        proxy_send_timeout 30s;
        proxy_read_timeout 12m;
        proxy_pass http://app:3375;
    }

    # Avoid Nginx's automatic slash redirect for the download asset prefix:
    # /download is a Next.js page, not a directory on the public host.
    location = /minpred/download {
        proxy_pass http://app:3375;
    }

    location ^~ /minpred/download/ {
        limit_conn minpred_conn 1;
        limit_rate_after 10m;
        limit_rate 20m;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://app:3375;
    }

    location / {
        limit_conn minpred_conn 20;
        proxy_pass http://app:3375;
    }
}
